<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunaris</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="title-section">
            <h1>Lunaris</h1>
        </div>
        
        <!-- Main menu buttons -->
        <div id="main-menu">
            <button id="btn-play" class="menu-button">Play</button>
            <button id="btn-settings" class="menu-button">Settings</button>
            <button id="btn-credits" class="menu-button">Credits</button>
        </div>
        
        <!-- Container for dynamic screens -->
        <div id="screen-container"></div>
        
        <!-- Loading message (hidden after init) -->
        <p id="loading-message" style="display: none;">Lunaris is loading...</p>
    </div>
    
    <!-- Save System Scripts -->
    <script src="src/save/saveSerializer.js"></script>
    <script src="src/save/saveValidator.js"></script>
    <script src="src/save/saveSlots.js"></script>
    <script src="src/save/saveManager.js"></script>
    <script src="src/save/settingsManager.js"></script>
    
    <script src="main.js"></script>
</body>
</html>
