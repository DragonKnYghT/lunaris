<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play - Lunaris</title>
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/loader.css">
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <!-- LUNARIS_TODO: replace placeholder colors with final Lunaris theme -->
    <style>
        #game-container {
            width: 100%;
            min-height: 600px;
            background-color: #1a1a2e;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        
        #game-loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        
        #game-loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .game-loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .game-loading-text {
            color: #ffffff;
            margin-top: 20px;
            font-size: 1.2rem;
        }
        
        /* LUNARIS_TODO: add animated transition into the game */
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <img src="assets/logo.png" alt="Lunaris Logo" class="logo-img">
                </a>
                <nav class="main-nav">
                    <ul class="nav-list">
                        <li><a href="index.html" class="nav-link">Home</a></li>
                        <li><a href="play.html" class="nav-link active">Play</a></li>
                        <li><a href="howto.html" class="nav-link">How to Play</a></li>
                        <li><a href="about.html" class="nav-link">About</a></li>
                        <li><a href="patchnotes.html" class="nav-link">Patch Notes</a></li>
                        <li><a href="credits.html" class="nav-link">Credits</a></li>
                    </ul>
                </nav>
                <button class="mobile-menu-toggle" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <main class="site-main">
        <section class="page-header">
            <div class="container">
                <h1>Play Lunaris</h1>
            </div>
        </section>

        <section class="content-section">
            <div class="container">
                <div id="game-container">
                    <div id="game-loading">
                        <div class="game-loading-spinner"></div>
                        <p class="game-loading-text">Loading Lunaris...</p>
                    </div>
                    <!-- Game canvas will be inserted here -->
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-links">
                    <a href="index.html">Home</a>
                    <a href="about.html">About</a>
                    <a href="howto.html">How to Play</a>
                    <a href="patchnotes.html">Patch Notes</a>
                    <a href="credits.html">Credits</a>
                </div>
                <div class="footer-info">
                    <p>&copy; 2024 Lunaris. All rights reserved.</p>
                    <p class="version">Version 0.1.0</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="assets/js/navigation.js"></script>
    <script>
        // Hide loading screen when game is ready
        window.addEventListener('load', function() {
            // Simulate game loading
            setTimeout(function() {
                var loading = document.getElementById('game-loading');
                if (loading) {
                    loading.classList.add('hidden');
                }
            }, 2000);
            
            // Load game script
            // LUNARIS_TODO: Load built game bundle (dist/main.js or equivalent)
            var script = document.createElement('script');
            script.src = '../main.js';
            script.onload = function() {
                console.log('Game loaded successfully');
                // Initialize game if needed
                if (typeof init === 'function') {
                    init();
                }
            };
            script.onerror = function() {
                console.error('Failed to load game script');
            };
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
