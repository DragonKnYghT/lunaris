;<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play - Lunaris</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/loader.css">
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <!-- LUNARIS_TODO: replace placeholder colors with final Lunaris theme -->
    <style>
        #game-container {
            width: 100%;
            min-height: 600px;
            background-color: #1a1a2e;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        
        #game-loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        
        #game-loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .game-loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .game-loading-text {
            color: #ffffff;
            margin-top: 20px;
            font-size: 1.2rem;
        }
        
        /* LUNARIS_TODO: add animated transition into the game */
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <img src="Lunaris_logo_fond.png" alt="Lunaris Logo" class="logo-img">
                </a>
                <nav class="main-nav">
                    <ul class="nav-list">
                        <li><a href="index.html" class="nav-link" data-i18n="common.home">Home</a></li>
                        <li><a href="play.html" class="nav-link active" data-i18n="common.play">Play</a></li>
                        <li><a href="howto.html" class="nav-link" data-i18n="common.howToPlay">How to Play</a></li>
                        <li><a href="about.html" class="nav-link" data-i18n="common.about">About</a></li>
                        <li><a href="patchnotes.html" class="nav-link" data-i18n="common.patchNotes">Patch Notes</a></li>
                        <li><a href="credits.html" class="nav-link" data-i18n="common.credits">Credits</a></li>
                        <li class="nav-buttons">
                            <button class="language-switch" id="languageSwitch" aria-label="Switch language">
                                <span class="lang-en">EN</span> / <span class="lang-fr">FR</span>
                            </button>
                            <button class="theme-switch" id="themeSwitch" aria-label="Switch theme">
                                <span class="theme-icon">🌙</span>
                            </button>
                        </li>
                    </ul>
                </nav>
                <button class="mobile-menu-toggle" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <main class="site-main">
        <section class="page-header">
            <div class="container">
                <h1 data-i18n="game.playMenu.title">Play Lunaris</h1>
            </div>
        </section>

        <section class="content-section">
            <div class="container">
                <div id="game-container">
                    <div id="game-loading">
                        <div class="game-loading-spinner"></div>
                        <p class="game-loading-text" data-i18n="game.loading">Loading Lunaris...</p>
                    </div>
                    <h1 class="game-title">Lunaris</h1>
                    <p class="game-subtitle" data-i18n="game.creditsMenu.description">A Modular Creature-Battling Roguelike</p>
                    <div id="loading-message"></div>
                    <div id="screen-container"></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-links">
                    <a href="index.html" data-i18n="common.home">Home</a>
                    <a href="about.html" data-i18n="common.about">About</a>
                    <a href="howto.html" data-i18n="common.howToPlay">How to Play</a>
                    <a href="patchnotes.html" data-i18n="common.patchNotes">Patch Notes</a>
                    <a href="credits.html" data-i18n="common.credits">Credits</a>
                </div>
                <div class="footer-info">
                    <p data-i18n="website.footer.copyright">&copy; 2024 Lunaris. All rights reserved.</p>
                    <p class="version"><span data-i18n="common.version">Version</span> 0.1.0</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts - Load in order: translationManager, audioSettings, siteManager, navigation -->
    <script src="src/settings/translationManager.js"></script>
    <script src="src/settings/audioSettings.js"></script>
    <script src="assets/js/siteManager.js"></script>
    <script src="assets/js/navigation.js"></script>
    <script>
        // Initialize site manager on page load
        document.addEventListener('DOMContentLoaded', async function() {
            await siteManager.init();
        });
        
        // Load game when page is ready
        window.addEventListener('load', function() {
            // Load game script
            var script = document.createElement('script');
            script.src = 'main.js';
            script.onload = function() {
                console.log('Game script loaded successfully');
                // Initialize game after data loads
                if (typeof startLunaris === 'function') {
                    startLunaris().then(function() {
                        // Hide loading screen after game starts
                        setTimeout(function() {
                            var loading = document.getElementById('game-loading');
                            if (loading) {
                                loading.classList.add('hidden');
                            }
                        }, 1000);
                    });
                } else if (typeof init === 'function') {
                    init();
                    // Hide loading screen after init
                    setTimeout(function() {
                        var loading = document.getElementById('game-loading');
                        if (loading) {
                            loading.classList.add('hidden');
                        }
                    }, 1000);
                }
            };
            script.onerror = function() {
                console.error('Failed to load game script from main.js');
                // Try alternative path
                var altScript = document.createElement('script');
                altScript.src = 'main.js';
                altScript.onload = function() {
                    console.log('Game loaded from alternative path');
                    if (typeof startLunaris === 'function') {
                        startLunaris();
                    } else if (typeof init === 'function') {
                        init();
                    }
                    setTimeout(function() {
                        var loading = document.getElementById('game-loading');
                        if (loading) {
                            loading.classList.add('hidden');
                        }
                    }, 1000);
                };
                altScript.onerror = function() {
                    console.error('Failed to load game script from main.js');
                };
                document.body.appendChild(altScript);
            };
            document.head.appendChild(script);
        });
    </script>
</body>
</html>
