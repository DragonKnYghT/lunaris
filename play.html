<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play - Lunaris</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/loader.css">
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <style>
        #game-container {
            width: 100%;
            min-height: 600px;
            max-height: calc(100vh - 150px);
            background-color: var(--bg-dark);
            border-radius: 8px;
            overflow-y: auto;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        #game-loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-light) 100%);
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        
        #game-loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .game-loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--color-secondary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .game-loading-text {
            color: var(--text-primary);
            margin-top: 20px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <img src="Lunaris_logo_fond.png" alt="Lunaris Logo" class="logo-img">
                </a>
                <nav class="main-nav">
                    <ul class="nav-list">
                        <li><a href="index.html" class="nav-link" data-i18n="common.home">Home</a></li>
                        <li><a href="play.html" class="nav-link active" data-i18n="common.play">Play</a></li>
                        <li><a href="howto.html" class="nav-link" data-i18n="common.howToPlay">How to Play</a></li>
                        <li><a href="about.html" class="nav-link" data-i18n="common.about">About</a></li>
                        <li><a href="patchnotes.html" class="nav-link" data-i18n="common.patchNotes">Patch Notes</a></li>
                        <li><a href="credits.html" class="nav-link" data-i18n="common.credits">Credits</a></li>

                        <!-- Cyber -->

                        <option value="11">Cyber Light</option>

                        <!-- Lotus -->
                        <option value="12">Lotus Dark</option>
                        <option value="13">Lotus Light</option>

                        <!-- Abyssal -->
                        <option value="14">Abyssal Dark</option>
                        <option value="15">Abyssal Light</option>

                        <!-- Lycoris Rouge -->

                        <!-- Glacier -->

                        <!-- Zenith -->

                        <!-- Hori -->
                        <option value="30">Hori Dark</option>
                        <option value="31">Hori Light</option>

                        <!-- Minuit -->
                        <option value="32">Minuit Dark</option>
                        <option value="33">Minuit Light</option>

                        <!-- Ranni -->

                </div>
                <button class="mobile-menu-toggle" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <main class="site-main">
        <section class="page-header">
            <div class="container">
<h1 data-i18n="game.playMenu.title">Play</h1>
            </div>
        </section>

        <section class="content-section">
            <div class="container">
                <div id="game-container">
                    <div id="game-loading">
                        <div class="game-loading-spinner"></div>
                        <p class="game-loading-text" data-i18n="game.loading">Loading Lunaris...</p>
                    </div>
                    <div id="loading-message"></div>
                    <div id="screen-container"></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">

            <div class="footer-content">

<p data-i18n="website.footer.copyright">&copy; 2026 Lunaris. All rights reserved.</p>

                </div>
            </div>
        </div>
    </footer>

    <script src="src/settings/translationManager.js"></script>
    <script src="src/settings/audioSettings.js"></script>
    <script src="src/save/accountManager.js"></script>
    <script src="src/ui/accountUI.js"></script>
    <script src="assets/js/siteManager.js"></script>
    <script src="assets/js/navigation.js"></script>
    <link rel="stylesheet" href="assets/css/account-ui.css">
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            await siteManager.init();
        });
        
        window.addEventListener('load', function() {
            var script = document.createElement('script');
            script.src = 'main.js';
            script.onload = function() {
                console.log('Game script loaded successfully');
                if (typeof startLunaris === 'function') {
                    startLunaris().then(function() {
                        setTimeout(function() {
                            var loading = document.getElementById('game-loading');
                            if (loading) {
                                loading.classList.add('hidden');
                            }
                        }, 1000);
                    });
                } else if (typeof init === 'function') {
                    init();
                    setTimeout(function() {
                        var loading = document.getElementById('game-loading');
                        if (loading) {
                            loading.classList.add('hidden');
                        }
                    }, 1000);
                }
            };
            script.onerror = function() {
                console.error('Failed to load game script from main.js');
            };
            document.head.appendChild(script);
        });
    </script>
</body>
</html>
